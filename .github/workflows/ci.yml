name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Normal CI: PRs and pushes to main (tag pushes go to the release job instead)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write    # required to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        tar -czf craps-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
          -C target/${{ matrix.target }}/release craps

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path "target/${{ matrix.target }}/release/craps.exe" `
          -DestinationPath "craps-${{ github.ref_name }}-${{ matrix.target }}.zip"

    - name: Extract release notes from CHANGELOG
      shell: bash
      run: |
        awk -v tag="${GITHUB_REF_NAME}" '
          index($0, "## [" tag "]") == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found && /^\[.*\]: http/ { next }
          found { print }
        ' CHANGELOG.md > RELEASE_NOTES.md
        # Fail loudly if we matched nothing (typo'd tag vs. changelog entry)
        [ -s RELEASE_NOTES.md ] || { echo "No CHANGELOG section for ${GITHUB_REF_NAME}" >&2; exit 1; }

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: craps-*
        body_path: RELEASE_NOTES.md